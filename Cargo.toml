[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "argentum_coop"
version = "0.1.0"
edition = "2024"

[features]
default = []

[workspace.dependencies]
bevy = { version = "0.18", features = [
    "dynamic_linking",
    "track_location",
    "serialize",
    "jpeg",
] }

strum = "0.27.2"
strum_macros = "0.27.2"
#vec-collections = "0.4.3"
debug_unwraps = "0.1.0"
nano-id = "0.4.0"
rand = "0.9.2"
rand_distr = "0.5.1"
rand_seeder = "*"
rand_pcg = "*"

bevy_ecs_tilemap = { path = "aother/tmap", features = ["serde"] }
bevy_simple_scroll_view = "0.4.0"
bevy_ui_text_input = { git = "https://github.com/Elekrisk/bevy_ui_text_input/", branch = "bevy-0.18" }
bevy_replicon = "0.38.2"
bevy_replicon_renet = "0.14"
bevy_common_assets = { version = "0.15.0", features = ["ron"]}
bevy-ui-gradients = "0.4.0"
bevy_spritesheet_animation = "6.1.0"
bevy_asset_loader = "0.25.0"
bevy-inspector-egui = "0.36.0"
paste = "1.0"
smallvec = "1.15.1"

serde = { version = "1.0.228", features = ["derive"] }
splines = { version = "5.0.0", features = ["serde"] }
indexmap = "2.13.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
bevy-fps-counter = "0.9.0"
bit-vec = "0.8.0"
delegate = "0.13.5"

noiz = "0.4.0"
avian2d = "0.5.0"
#bevy_save = "1.0.0"
#bevy_rand = "0.11.1"
#bevy_enhanced_input = "0.15.2"
#bevy_northstar = "0.3.1"
#big_brain = "0.22.0"

#cargo upgrade --incompatible

[dependencies]

multiplayer_shared = { path = "crates/multiplayer_shared" }
common = { path = "crates/acommon" }
asset_loading = { path = "crates/asset_loading" }
game_common = { path = "crates/agame_common" }
debug = { path = "crates/debug" }
host = { path = "crates/host" }
client = { path = "crates/client" }
tilemap = { path = "crates/tilemap" }
tilemap_shared = { path = "crates/tilemap_shared" }
modifier = { path = "crates/modifier" }
game = { path = "crates/game" }
movement = { path = "crates/movement" }
being = { path = "crates/being" }
camera = { path = "crates/camera" }
dimension = { path = "crates/dimension" }
#sprite_animation_shared = { path = "crates/sprite_animation_shared" }
#sprite_shared = { path = "crates/sprite_shared" }
sprite_animation = { path = "crates/sprite_animation" }
sprite = { path = "crates/sprite" }
faction = { path = "crates/faction" }
player = { path = "crates/player" }
color_sampler = { path = "crates/color_sampler" }
shader = { path = "crates/shader" }
ui_shared = { path = "crates/ui_shared" }
pregame_screen = { path = "crates/pregame_screen" }
setup_screen = { path = "crates/setup_screen" }
#param_sets = { path = "crates/param_sets" }

bevy = { workspace = true }
bevy-inspector-egui = { workspace = true }
tracing = { workspace = true }
#tracing-subscriber = { workspace = true }
avian2d = { workspace = true }

#log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] } # Improve Runtime Performance (Optional)
#bevy_northstar = "0.3.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
